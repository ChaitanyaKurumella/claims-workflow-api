name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run format:check && npm test && npm run build
        working-directory: web
      - run: dotnet test tests/Claims.Tests/Claims.Tests.csproj --configuration Release
      - run: |
          mkdir -p src/Claims.Api/wwwroot
          cp -R web/dist/dashboard/browser/. src/Claims.Api/wwwroot/
          dotnet publish src/Claims.Api --configuration Release --output artifacts/app
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-test-results
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: claims-workflow-app
          path: artifacts/app
